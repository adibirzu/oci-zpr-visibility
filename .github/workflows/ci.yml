name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q
      - name: Coverage gate (pure-logic core >= 80%)
        run: |
          pytest tests/ -q \
            --cov=oci_zpr_visibility.jsonutil \
            --cov=oci_zpr_visibility.security_attributes \
            --cov=oci_zpr_visibility.policy_parser \
            --cov=oci_zpr_visibility.correlate \
            --cov=oci_zpr_visibility.findings

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"
      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
