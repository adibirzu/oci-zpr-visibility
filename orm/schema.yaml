title: "OCI ZPR Visibility Lab"
description: "Zero Trust Packet Routing visibility: tagged VCN + web/db endpoints, ZPR policy, VCN Flow Logs, and an autonomous refresh unit (controller VM or serverless OCI Function) that builds the Log Analytics source, fields, dashboard, and metrics."
schemaVersion: 1.1.0
version: "1.1.0"
locale: "en"

variableGroups:
  - title: "Placement"
    variables: ["compartment_ocid", "region", "availability_domain"]
  - title: "Lab"
    variables: ["instance_image_ocid", "ssh_public_key"]
  - title: "Autonomy"
    variables: ["installation_id", "deployment_mode", "function_image"]
  - title: "Hidden"
    variables: ["tenancy_ocid", "package_tarball_path"]
    visible: false

variables:
  installation_id:
    type: string
    title: "Installation owner ID"
    description: "3-40 lowercase letters, digits or hyphens. Keep unchanged for upgrades. Log Analytics objects and state are installation-bound."
    default: zpr-visibility
    required: true
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Compartment for the lab resources."
    required: true
  region:
    type: oci:identity:region:name
    title: "Region"
    required: true
  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: "Availability Domain"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
  instance_image_ocid:
    type: oci:core:image:id
    title: "Oracle Linux 9 image (E3.Flex)"
    description: "Image for the web/db endpoint VMs (and the controller VM, if that mode is selected)."
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key (optional)"
    required: false
  deployment_mode:
    type: enum
    title: "Autonomy mode"
    description: "Controller VM: private VM, supervised bootstrap/readiness and a 15-minute refresh timer. Resource Manager provisions infrastructure; verify ingestion and dashboards through the documented OCI CLI lifecycle checks after apply. Function mode requires a separately published image and scheduler."
    enum:
      - controller_vm
      - function
    default: controller_vm
    required: true
  function_image:
    type: string
    title: "Function image (OCIR)"
    description: "OCIR image built with 'fn deploy', e.g. <region>.ocir.io/<namespace>/zpr-visibility-refresh:0.0.1. Leave blank to create only the Functions application + IAM now and add the function later. Only used when Autonomy mode = function."
    required: false
    visible:
      eq:
        - deployment_mode
        - function
