[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-zpr-visibility"
version = "0.1.0"
description = "OCI Zero Trust Packet Routing visibility collector, flow correlator, and Log Analytics integration helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "oci>=2.176.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
oci-zpr-visibility = "oci_zpr_visibility.cli:main"

[tool.setuptools.packages.find]
include = ["oci_zpr_visibility*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Coverage gate is scoped to the deterministic pure-logic core. Cloud/IO modules
# (collector, oci_clients, provision_la, validate_dashboards, seed, trigger,
# logging_ingestion) are exercised by the live e2e, not unit tests. CI runs:
#   pytest --cov=oci_zpr_visibility.jsonutil --cov=oci_zpr_visibility.security_attributes \
#          --cov=oci_zpr_visibility.policy_parser --cov=oci_zpr_visibility.correlate \
#          --cov=oci_zpr_visibility.findings
[tool.coverage.report]
fail_under = 80
show_missing = true
